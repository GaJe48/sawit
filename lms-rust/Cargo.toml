[package]
name = "lms-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { version = "0.1.91", default-features = false }
futures = { version = "0.3.33", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form", "multipart", "rustls-no-provider", "stream"] }
rustls = "0.23"
webpki-roots = "1"
scraper = { version = "0.27.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros"] }
uniffi = { version = "0.32.0", default-features = false, features = ["cli", "tokio"] }
ocr-rs = "2.4.0"
image = { version = "0.25.10", default-features = false }
bytes = "1.12.1"
tokio-util = { version = "0.7.19", features = ["io"] }
async-stream = "0.3.6"
thiserror = "2.0.19"
mime_guess = "2.0.5"
infer = "0.22.0"

[lib]
crate-type = ["cdylib"]
